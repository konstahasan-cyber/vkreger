# Production override for a server: Caddy terminates HTTP(S) on 80/443,
# backend and frontend are not exposed directly.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  backend:
    ports: !reset []
  frontend:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # Without a domain HTTPS_BIND=127.0.0.1:8443 keeps 443 closed from outside (browsers trying
      # https:// fall back to http://) and does not clash with other services (e.g. a VPN) on 443.
      - "${HTTPS_BIND:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
